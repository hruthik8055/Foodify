<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Foodify - Sign Up</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }


        body {
            min-height: 100vh;
            background-color: #f7f3e9;
            display: flex;
            justify-content: center;
            align-items: center;
        }


        /* =========================
           SIGN UP CONTAINER
           ========================= */

        .signup-container {
            width: 90%;
            max-width: 500px;
            background-color: white;
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(18, 60, 61, 0.15);
        }


        /* =========================
           LOGO
           ========================= */

        .logo {
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            color: #e9c46a;
            background-color: #123c3d;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 25px;
        }


        /* =========================
           TITLE
           ========================= */

        .signup-container h1 {
            text-align: center;
            color: #123c3d;
            font-size: 28px;
            margin-bottom: 8px;
        }


        .subtitle {
            text-align: center;
            color: #667777;
            font-size: 14px;
            margin-bottom: 28px;
        }


        /* =========================
           FORM
           ========================= */

        .form-group {
            margin-bottom: 18px;
        }


        .form-group label {
            display: block;
            color: #123c3d;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 7px;
        }


        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d5d5d5;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            background-color: white;
        }


        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #123c3d;
        }


        /* =========================
           ADDRESS
           ========================= */

        .form-group textarea {
            height: 90px;
            resize: none;
        }


        /* =========================
           SIGN UP BUTTON
           ========================= */

        .signup-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background-color: #123c3d;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 5px;
        }


        .signup-btn:hover {
            background-color: #1c6263;
        }


        /* =========================
           SIGN IN
           ========================= */

        .signin-text {
            text-align: center;
            margin-top: 22px;
            font-size: 14px;
            color: #667777;
        }


        .signin-text a {
            color: #123c3d;
            text-decoration: none;
            font-weight: bold;
        }


        .signin-text a:hover {
            color: #e9c46a;
        }


        /* =========================
           MOBILE
           ========================= */

        @media (max-width: 600px) {

            .signup-container {
                width: 92%;
                padding: 30px 25px;
            }

            .logo {
                font-size: 28px;
            }

            .signup-container h1 {
                font-size: 25px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         SIGN UP CONTAINER
         ========================= -->

    <div class="signup-container">


        <!-- LOGO -->

        <div class="logo">
            Foodify
        </div>


        <!-- TITLE -->

        <h1>
            Create Your Account
        </h1>


        <p class="subtitle">
            Sign up to get started with Foodify
        </p>


        <!-- =========================
             SIGN UP FORM
             ========================= -->

        <form action="/Foodify/registerServlet" method="POST">


            <!-- NAME -->

            <div class="form-group">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                    required
                >

            </div>


            <!-- EMAIL -->

            <div class="form-group">

                <label for="email">
                    Email ID
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email ID"
                    required
                >

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

            </div>




			<!-- CONFIRM PASSWORD -->

			<div class="form-group">

				<label for="confirmPassword"> Confirm Password </label> <input
					type="password" id="confirmPassword" name="confirmPassword"
					placeholder="Confirm your password" required>

			</div>



			<!-- ROLE -->

            <div class="form-group">

                <label for="role">
                    Role
                </label>

                <select id="role" name="role" required>

                    <option value="">
                        Select your role
                    </option>

                    <option value="customer">
                        Customer
                    </option>

                    <option value="restaurant_admin">
                        Restaurant Admin
                    </option>

                    <option value="super_admin">
                        Super Admin
                    </option>

                </select>

            </div>


            <!-- ADDRESS -->

            <div class="form-group">

                <label for="address">
                    Address
                </label>

                <textarea
                    id="address"
                    name="address"
                    placeholder="Enter your complete address"
                    required
                ></textarea>

            </div>


            <!-- SIGN UP BUTTON -->

            <button
                type="submit"
                class="signup-btn">
                Sign Up
            </button>


        </form>


        <!-- SIGN IN LINK -->

        <div class="signin-text">

            Already have an account?

            <a href="login.html">
                Sign In
            </a>

        </div>


    </div>


</body>

</html>
